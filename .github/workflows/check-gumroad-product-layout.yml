name: Inspect Gumroad product landing layout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-gumroad-product-layout.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect published product HTML without modifications
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.parse, urllib.request
          token=os.environ.get("GUMROAD_ACCESS_TOKEN", "")
          if not token: raise SystemExit("Missing Gumroad token")
          url="https://api.gumroad.com/v2/products/zvxja/custom_html?"+urllib.parse.urlencode({"access_token":token})
          with urllib.request.urlopen(urllib.request.Request(url),timeout=30) as res:
              obj=json.load(res)
          html=obj.get("custom_html") or ""
          print("success:",obj.get("success"),"has_landing_page:",obj.get("has_landing_page"),"html_length:",len(html))
          print("known_links:",[part for part in ("ALL TABS", "OFFICIAL DOWNLOAD", "BACK TO ALL", "BUY NOW") if part in html])
          print("head_preview:",html[:1800].replace("\n"," ").replace("\r"," "))
          PY
