name: Align Gumroad product page back navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-gumroad-product-navigation.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Carefully update one Gumroad product landing page
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          token=os.environ.get("GUMROAD_ACCESS_TOKEN","")
          if not token: raise SystemExit("Missing Gumroad access token")
          root="https://api.gumroad.com/v2/products/zvxja"
          def api(path, fields=None, method="GET"):
              if method=="GET":
                  url=root+path+"?"+urllib.parse.urlencode({"access_token":token})
                  request=urllib.request.Request(url,method=method)
              else:
                  params={"access_token":token}
                  params.update(fields or {})
                  request=urllib.request.Request(root+path,data=urllib.parse.urlencode(params).encode(),method=method)
              with urllib.request.urlopen(request,timeout=45) as res:return json.load(res)
          current=api("/custom_html")
          if not current.get("success") or not current.get("has_landing_page"):
              raise SystemExit("Unexpected product state; leave product unchanged")
          old=current.get("custom_html") or ""
          if 'data-sl-product-nav="v2"' in old:
              print("Already fixed, no update necessary")
              raise SystemExit(0)
          crumb=r'<div class="crumb">\s*<a href="https://simonlibonstore\.gumroad\.com/?">TABS &amp; BACKING TRACKS</a><b>/</b>OFFICIAL DOWNLOAD</div>'
          bottom='<a class="back-link" href="https://simonlibonstore.gumroad.com">BACK TO ALL PRODUCTS</a>'
          if len(re.findall(crumb,old))!=1 or old.count(bottom)!=1 or old.count('data-gumroad-action="buy"')!=1 or old.count("</style>")!=1:
              raise SystemExit("Existing landing page changed; refuse unsafe patch")
          print("Existing page verified, character length",len(old))
          newcrumb='<div class="crumb"><a class="shop-return-top" data-sl-product-nav="v2" href="https://simonlibonstore.gumroad.com/"><span class="back-arrow" aria-hidden="true">←</span><span>ALL TABS &amp; BACKING TRACKS</span></a></div>'
          css="""
          /* Match the main site's top-left back navigation. */
          .crumb{margin:0 0 32px;padding:0 0 24px;border-bottom:1px solid var(--line);font-size:11px;color:#3e3b42;letter-spacing:.1em;font-weight:700}
          .crumb .shop-return-top{display:inline-flex;align-items:center;gap:12px;border:0;padding:0;text-decoration:none;color:inherit;font-weight:700}
          .crumb .back-arrow{font-size:27px;line-height:1;font-weight:400;letter-spacing:0}
          @media(max-width:650px){.crumb{margin:0 0 24px;padding:0 0 20px}.crumb .shop-return-top{gap:11px;letter-spacing:.075em;font-size:10px}.crumb .back-arrow{font-size:24px}}
          """
          revised=re.sub(crumb,lambda m:newcrumb,old,count=1).replace(bottom,"",1).replace("</style>",css+"</style>",1)
          if revised==old or "BACK TO ALL PRODUCTS" in revised or revised.count('data-gumroad-action="buy"')!=1:
              raise SystemExit("Post-patch checks failed")
          open("/tmp/gumroad-product-zvxja-before.html","w",encoding="utf-8").write(old)
          prev=api("/preview_custom_html",{"custom_html":revised},"POST")
          cleaned=prev.get("custom_html") or ""
          if not prev.get("success") or 'data-sl-product-nav="v2"' not in cleaned or 'ALL TABS &amp; BACKING TRACKS' not in cleaned or 'data-gumroad-action="buy"' not in cleaned or 'BACK TO ALL PRODUCTS' in cleaned:
              raise SystemExit("Gumroad preview did not preserve navigation and checkout. No changes made. "+str(prev.get("message","")))
          print("Preview successful; removed elements:",prev.get("sanitization_report",{}).get("total_removed"))
          pub=api("",{"custom_html":revised},"PUT")
          updated=(pub.get("product") or {}).get("custom_html") or ""
          if not pub.get("success") or 'data-sl-product-nav="v2"' not in updated or 'data-gumroad-action="buy"' not in updated:
              raise SystemExit("Gumroad did not confirm updated product page")
          print("Product page published; has top back arrow; bottom link removed; checkout button preserved.")
          PY
      - name: Save product HTML backup if published
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gumroad-product-zvxja-before-navigation-fix
          path: /tmp/gumroad-product-zvxja-before.html
          if-no-files-found: ignore
          retention-days: 30
