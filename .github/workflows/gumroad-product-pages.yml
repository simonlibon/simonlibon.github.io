name: Keep Gumroad product pages on-brand
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gumroad-product-pages.yml'
      - 'scripts/publish_gumroad_product_pages.py'
      - 'scripts/gumroad-product-template.html'
      - 'scripts/mirror_gumroad.py'
      - 'scripts/render_gumroad_products.py'
      - 'scripts/render_gumroad_catalog.py'
      - 'catalog.js'
      - 'shop-model.js'
      - 'product.html'
      - 'style.css'
      - 'shop.css'
      - 'site.js'
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
concurrency:
  group: gumroad-native-product-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  product-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish branded Gumroad product pages
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: python3 scripts/publish_gumroad_product_pages.py --publish
