name: Keep Gumroad product pages on-brand
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
concurrency:
  group: gumroad-website-product-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  product-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish branded Gumroad product pages
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: python3 scripts/publish_gumroad_product_pages.py --publish
