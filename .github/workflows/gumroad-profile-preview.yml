name: Check Gumroad profile custom HTML (read-only preview)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gumroad-profile-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Preview branded profile without publishing
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          token = os.environ.get("GUMROAD_ACCESS_TOKEN", "")
          if not token:
              raise SystemExit("ERROR: missing GUMROAD_ACCESS_TOKEN")
          html = open("gumroad-profile.html",encoding="utf-8").read()
          data = urllib.parse.urlencode({"access_token":token,"custom_html":html}).encode()
          req = urllib.request.Request("https://api.gumroad.com/v2/user/preview_custom_html",data=data,method="POST")
          try:
              with urllib.request.urlopen(req,timeout=30) as resp: obj=json.load(resp)
          except urllib.error.HTTPError as exc:
              print("preview_http_status:",exc.code)
              print("preview_response:",exc.read().decode("utf-8","replace")[:1200])
              raise SystemExit(2)
          clean=obj.get("custom_html","")
          report=obj.get("sanitization_report",{})
          print("preview_ok:",obj.get("success"),"input_length:",len(html),"output_length:",len(clean))
          print("script_kept:",'document.getElementById("gumroad-data")' in clean)
          print("product_render_kept:",'function render()' in clean)
          print("style_kept:",'.products{' in clean)
          print("content_removed_count:",report.get("total_removed"))
          print("sanitization_report:",json.dumps(report,ensure_ascii=False)[:3500])
          if not obj.get("success") or "function render()" not in clean:
              raise SystemExit("Preview did not preserve required product-rendering code")
          PY
