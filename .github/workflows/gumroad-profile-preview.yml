name: Check Gumroad profile custom HTML (read-only preview)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gumroad-profile-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test Gumroad custom profile HTML without publishing
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          token = os.environ.get("GUMROAD_ACCESS_TOKEN", "")
          if not token:
              raise SystemExit("ERROR: GUMROAD_ACCESS_TOKEN secret is absent")
          html = '''<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://simonlibon.github.io/tabs.html"><style>body{background:#faf9f7;color:#18181a;font-family:sans-serif}</style></head><body><main><h1>SIMON LIBON</h1><p>OFFICIAL TABS &amp; BACKING TRACKS</p><a href="https://simonlibon.github.io/tabs.html" target="_blank">OPEN OFFICIAL SHOP</a></main><script>location.replace("https://simonlibon.github.io/tabs.html")</script></body></html>'''
          data = urllib.parse.urlencode({"access_token":token,"custom_html":html}).encode()
          req = urllib.request.Request("https://api.gumroad.com/v2/user/preview_custom_html",data=data,method="POST")
          try:
              with urllib.request.urlopen(req,timeout=30) as resp:
                  obj=json.load(resp)
              cleaned=obj.get("custom_html","")
              print("preview_ok:",obj.get("success"),"html_length:",len(cleaned))
              print("meta_refresh_kept:",'http-equiv="refresh"' in cleaned.lower())
              print("inline_redirect_kept:",'location.replace' in cleaned)
              print("external_link_kept:","https://simonlibon.github.io/tabs.html" in cleaned)
              print("sanitization_report:",json.dumps(obj.get("sanitization_report",{}),ensure_ascii=False)[:1700])
          except urllib.error.HTTPError as exc:
              body=exc.read().decode("utf-8","replace")
              print("preview_http_status:",exc.code)
              print("preview_response:",body[:1500])
              raise SystemExit(2)
          PY
