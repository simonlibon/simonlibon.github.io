name: Mirror official site sections on Gumroad
on:
  # All official site commits refresh the Gumroad mirror. The catalogue
  # synchronizer additionally dispatches this workflow because GitHub Actions
  # does not propagate push triggers from the default GITHUB_TOKEN.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
permissions:
  contents: read
concurrency:
  group: gumroad-website-product-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact canonical HTML/CSS mirrors
        run: python3 scripts/build_gumroad_mirror_pages.py --output-dir "$RUNNER_TEMP/gumroad-pages"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install Gumroad CLI
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate seller and read existing pages
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GUMROAD_ACCESS_TOKEN"
          gumroad user --json --no-input > "$RUNNER_TEMP/user.json"
          python - "$RUNNER_TEMP/user.json" <<'PY'
          import json,sys
          user=json.load(open(sys.argv[1],encoding="utf-8")).get("user") or {}
          ids=[str(user.get(x) or '') for x in ('id','user_id')]
          names=[str(user.get(x) or '') for x in ('username','user_name')]
          urls=[str(user.get(x) or '') for x in ('url','profile_url')]
          assert ('2138284912808' in ids or 'simonlibonstore' in names or
                  any(u.rstrip('/')=='https://simonlibonstore.gumroad.com' for u in urls)), 'Wrong Gumroad seller'
          PY
          gumroad pages list --json --no-input > "$RUNNER_TEMP/existing.json"
          jq -e '.pages | type == "array"' "$RUNNER_TEMP/existing.json" > /dev/null
      - name: Preview every page before any change
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/approved-slugs.txt"
          for slug in $(cat "$RUNNER_TEMP/gumroad-pages/product-slugs.txt") music concerts tabs merch press privacy; do
            desired="$RUNNER_TEMP/gumroad-pages/$slug.html"
            current="$RUNNER_TEMP/current-$slug.html"
            # Skip only when the actual Gumroad page is identical to the
            # currently generated site revision. Do not use cached previews.
            if gumroad pages pull "$slug" -o "$current" --json --no-input > "$RUNNER_TEMP/current-$slug.json" 2>/dev/null; then
              if python3 scripts/verify_gumroad_route.py --slug "$slug" --generated "$desired" --published "$current" >/dev/null 2>&1; then
                echo "ALREADY CURRENT $slug"
                continue
              fi
            fi
            if gumroad pages preview "$RUNNER_TEMP/gumroad-pages/$slug.html" --json --no-input > "$RUNNER_TEMP/preview-$slug.json"; then
              echo "REMOTE PREVIEW ACCEPTED $slug"
            elif grep -Eiq 'rate_limited|rate.limit|too many requests' "$RUNNER_TEMP/preview-$slug.json"; then
              # Gumroad's preview quota cannot silently keep a page stale.
              # Validate the exact canonical version, publish it, then verify
              # the resulting live revision across every route.
              python3 scripts/verify_gumroad_route.py --slug "$slug" --generated "$desired"
              echo "::warning::Preview quota hit on $slug; relying on strict local and post-publication checks"
              echo "$slug" >> "$RUNNER_TEMP/approved-slugs.txt"
              continue
            else
              python - "$slug" "$RUNNER_TEMP/preview-$slug.json" <<'PY'
          import json,sys
          try:
              payload=json.load(open(sys.argv[2],encoding="utf-8"))
              msg=str(payload.get("message") or payload.get("error") or payload.get("code") or "unknown Gumroad error")
          except (OSError,ValueError):
              msg="unknown Gumroad CLI failure"
          raise SystemExit("Unexpected preview failure "+sys.argv[1]+": "+msg[:400])
          PY
            fi
            python - "$slug" "$RUNNER_TEMP/preview-$slug.json" "$RUNNER_TEMP/gumroad-pages/$slug.html" <<'PY'
          import json,sys
          slug=sys.argv[1]
          payload=json.load(open(sys.argv[2],encoding="utf-8"))
          page=payload.get("custom_html") or ""
          from pathlib import Path
          original=Path(sys.argv[3]).read_text(encoding="utf-8")
          required=["SIMON LIBON",'class="header"','class="footer"','data-sl-mirror-css="style.css"']
          if payload.get("success") is False or not page or any(x.lower() not in page.lower() for x in required):
              raise SystemExit("Sanitizer stripped essential page elements: "+slug)
          if 'id="newsletter-dialog"' in page:
              raise SystemExit("Gumroad still has an empty newsletter popup: "+slug)
          # The canonical product.html has no newsletter control in its footer;
          # all other site sections do, and must keep a working signup link.
          if not slug.startswith("product-") and 'href="https://simonlibon.github.io/?newsletter=1"' not in page:
              raise SystemExit("Working newsletter destination missing from "+slug)
          if slug.startswith("product-"):
              # A product page may use shared CSS for the shop cart, but it must
              # contain no clickable CART link on any branded product route.
              import re
              anchors=re.findall(r'<a\b[^>]*>',page,flags=re.I)
              if any(re.search(r'(?:\bshop-cart-link\b|\bsl-product-cart-link\b|https://gumroad\.com/checkout\b)',a,re.I) for a in anchors):
                  raise SystemExit("Product preview unexpectedly has a CART button: "+slug)
              # Gumroad strips custom <body> data attributes on standalone
              # product pages; verify the actual visual DOM and buy link.
              essentials=['data-sl-mirror-css="shop.css"', 'class="sl-product-layout"',
                          'id="product-buy"', 'id="product-price"', 'id="product-cover"']
              if any(x not in page for x in essentials):
                  missing=[x for x in essentials if x not in page]
                  raise SystemExit("Gumroad stripped essential product detail markup: "+slug+" missing="+repr(missing))
              if "simonlibonstore.gumroad.com/l/" not in page:
                  raise SystemExit("Gumroad detail missing real checkout: "+slug)
              if 'name="sl-download-format"' in original:
                  if page.count('name="sl-download-format"') < 2 or 'data-sl-inline-formats="v3"' not in page:
                      raise SystemExit("Gumroad removed the in-page Tab/Track radio selector: "+slug)
                  for code in ('#sl-format-tabs:checked ~', '#sl-format-pack:checked ~'):
                      if code not in page:
                          raise SystemExit("Gumroad removed the selection CSS: "+slug+" / "+code)
                  import re
                  for code in set(re.findall(r'/l/[A-Za-z0-9_-]+', original)):
                      if code not in page:
                          raise SystemExit("Gumroad lost one of the two checkout links on "+slug)
          if slug=="tabs":
              from scripts.render_gumroad_catalog import load_catalog, group_products
              bundles,tracks=group_products(load_catalog())
              expected=len(bundles)+len(tracks)
              found=page.count('class="shop-item"')
              if found!=expected:
                  raise SystemExit(f"Gumroad dropped shop cards: expected {expected}, sanitized {found}")
              if 'SHOP TEMPORARILY UNAVAILABLE' in page:
                  raise SystemExit("Old Gumroad shop failure UI is still present")
              if 'id="shop-empty"' in page and expected:
                  raise SystemExit("False empty-state panel still on the live shop")
              if 'data-sl-compact-cards="v2"' not in page:
                  raise SystemExit("Gumroad stripped the official compact-card sizes")
              if 'class="shop-payment-note"' in page:
                  raise SystemExit("Redundant checkout note still present")
              from scripts.render_gumroad_catalog import detail_url
              for group in bundles+tracks:
                  if detail_url(group) not in page:
                      raise SystemExit("Gumroad shop does not link to the branded product page: "+group["title"])
              print(f"SHOP DETAILS CHECK OK: {expected} cards, {sum(len(x['options']) for x in bundles+tracks)} branded detail pages")
          print("PREVIEW OK",slug,len(page),"chars")
          PY
            echo "$slug" >> "$RUNNER_TEMP/approved-slugs.txt"
          done
      - name: Publish only missing or previously mirrored pages
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for slug in $(cat "$RUNNER_TEMP/approved-slugs.txt"); do
            file="$RUNNER_TEMP/gumroad-pages/$slug.html"
            if jq -e --arg slug "$slug" '.pages[] | select(.slug == $slug)' "$RUNNER_TEMP/existing.json" >/dev/null; then
              # The pages list endpoint does not expose the full custom_html.
              # Pull the actual current page to verify our own signature and
              # keep a recoverable copy before replacing the creator's page.
              old="$RUNNER_TEMP/previous-$slug.html"
              if ! gumroad pages pull "$slug" -o "$old" --json --no-input > "$RUNNER_TEMP/pulled-$slug.json"; then
                echo "::error::Cannot back up $slug; incomplete Gumroad synchronization"
                exit 1
              fi
              if ! grep -Fq "data-sl-mirror=\"official-page-$slug\"" "$old" && ! grep -Fq 'data-sl-mirror-css="style.css"' "$old"; then
                echo "::error::Gumroad page $slug is not an owned canonical mirror; refusing unsafe change"
                exit 1
              fi
              gumroad pages push "$slug" "$file" --json --no-input > "$RUNNER_TEMP/out-$slug.json"
              echo "UPDATED $slug"
            else
              case "$slug" in
                music) title="Music";;
                concerts) title="Concerts";;
                tabs) title="Tabs & Backing Tracks";;
                merch) title="Merch";;
                press) title="Press / EPK";;
                privacy) title="Privacy Policy";;
                product-*) title="Product — ${slug#product-}";;
                *) echo "::error::Unexpected Gumroad page slug"; exit 1;;
              esac
              gumroad pages create --title "$title" --slug "$slug" "$file" --json --no-input > "$RUNNER_TEMP/out-$slug.json"
              echo "CREATED $slug"
            fi
            python - "$slug" "$RUNNER_TEMP/out-$slug.json" <<'PY'
          import json,sys
          if json.load(open(sys.argv[2],encoding="utf-8")).get("success") is False:
              raise SystemExit("Gumroad did not confirm page "+sys.argv[1])
          PY
          done
      - name: Verify updated Gumroad shop contains every official product
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          gumroad pages pull tabs -o "$RUNNER_TEMP/tabs-live.html" --json --no-input > "$RUNNER_TEMP/tabs-live.json"
          python - "$RUNNER_TEMP/tabs-live.html" <<'PY'
          from pathlib import Path
          import sys
          from scripts.render_gumroad_catalog import load_catalog,group_products
          cards=Path(sys.argv[1]).read_text(encoding="utf-8")
          bundles,tracks=group_products(load_catalog())
          expected=len(bundles)+len(tracks)
          actual=cards.count('class="shop-item"')
          if expected!=actual:
              raise SystemExit(f"Published Gumroad shop incomplete: {actual} cards vs {expected} on official site")
          if 'SHOP TEMPORARILY UNAVAILABLE' in cards or (expected and 'id="shop-empty"' in cards):
              raise SystemExit("Gumroad published an incorrect unavailable or empty-state panel")
          if 'id="newsletter-dialog"' in cards or 'href="https://simonlibon.github.io/?newsletter=1"' not in cards:
              raise SystemExit("Gumroad newsletter destination is not functional")
          if 'data-sl-compact-cards="v2"' not in cards:
              raise SystemExit("Gumroad published wrong cover/card dimensions")
          parity=['Final storefront parity: selectors survive Gumroad',
                  '#shop-catalog .shop-list-heading{',
                  '#shop-catalog .shop-item-title{',
                  '#shop-catalog .shop-item-actions a{',
                  'border-top:1px solid #dedbd7']
          if any(expected not in cards for expected in parity):
              raise SystemExit("Gumroad /tabs still shows the outdated section heading or links")
          from scripts.render_gumroad_catalog import detail_url
          for group in bundles+tracks:
              if detail_url(group) not in cards:
                  raise SystemExit("Gumroad shop card missing official-style detail link: "+group["title"])
          print(f"Published Gumroad shop verified: {actual} release cards linking to branded product pages")
          PY
      - name: Verify published product detail pages
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for slug in $(cat "$RUNNER_TEMP/gumroad-pages/product-slugs.txt"); do
            gumroad pages pull "$slug" -o "$RUNNER_TEMP/verified-$slug.html" --json --no-input > "$RUNNER_TEMP/verified-$slug.json"
            python - "$slug" "$RUNNER_TEMP/verified-$slug.html" "$RUNNER_TEMP/gumroad-pages/$slug.html" <<'PY'
          from pathlib import Path
          import sys
          slug=sys.argv[1]
          source=Path(sys.argv[2]).read_text(encoding="utf-8")
          required=['data-sl-mirror-css="shop.css"', 'id="product-buy"',
                    'id="product-price"', 'id="product-cover"',
                    'class="sl-product-layout"', 'simonlibonstore.gumroad.com/l/']
          if any(x not in source for x in required):
              raise SystemExit("Gumroad lost a published branded product detail page: "+slug)
          original=Path(sys.argv[3]).read_text(encoding="utf-8")
          import re
          for label,doc in (("published",source),("generated",original)):
              anchors=re.findall(r'<a\b[^>]*>',doc,flags=re.I)
              if any(re.search(r'(?:\bshop-cart-link\b|\bsl-product-cart-link\b|https://gumroad\.com/checkout\b)',a,re.I) for a in anchors):
                  raise SystemExit("CART button unexpectedly present on "+label+" product page "+slug)
          if source.count('name="sl-download-format"') != original.count('name="sl-download-format"'):
              raise SystemExit("Published format selector differs from the current catalogue: "+slug)
          for expected in ('font-size:16px!important', '@media(max-width:860px)', 'font-size:15px'):
              if expected in original and expected not in source:
                  raise SystemExit("Gumroad published an older CSS framing on "+slug+": "+expected)
          print("PRODUCT DETAIL VERIFIED", slug)
          PY
          done
      - name: Verify every published Gumroad path has the exact official site revision
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for slug in $(cat "$RUNNER_TEMP/gumroad-pages/product-slugs.txt") music concerts tabs merch press privacy; do
            gumroad pages pull "$slug" -o "$RUNNER_TEMP/verified-all-$slug.html" --json --no-input > "$RUNNER_TEMP/verified-all-$slug.json"
            python3 scripts/verify_gumroad_route.py --slug "$slug" --generated "$RUNNER_TEMP/gumroad-pages/$slug.html" --published "$RUNNER_TEMP/verified-all-$slug.html"
          done
          echo "ALL OFFICIAL GUMROAD ROUTES ARE CURRENT"
      - name: Save previous pages for rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gumroad-mirrored-pages-before
          path: ${{ runner.temp }}/previous-*.html
          if-no-files-found: warn
      - name: List resulting pages
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          gumroad pages list --json --no-input > "$RUNNER_TEMP/after.json"
          jq -r '.pages[] | select(.slug == "music" or .slug == "concerts" or .slug == "tabs" or .slug == "merch" or .slug == "press" or .slug == "privacy") | .slug' "$RUNNER_TEMP/after.json"
