name: Prepare release cover and thumbnail

on:
  workflow_dispatch:
    inputs:
      release_slug:
        description: Lowercase release slug (example new-single)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-artwork-${{ inputs.release_slug }}
  cancel-in-progress: false

jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processor
        run: python -m pip install Pillow
      - name: Create square cover and thumbnail
        run: python scripts/prepare_release_artwork.py "${{ inputs.release_slug }}"
      - name: Commit generated artwork
        env:
          RELEASE_SLUG: ${{ inputs.release_slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "release-artwork/$RELEASE_SLUG/cover-square.jpg" "release-artwork/$RELEASE_SLUG/thumbnail-square.jpg"
          git diff --cached --quiet && { echo "Artwork is already current"; exit 0; }
          git commit -m "Prepare square artwork for $RELEASE_SLUG"
          git push
