name: Preview complete Gumroad website
on:
  push:
    branches: [main]
    paths:
      - 'gumroad-site/profile.html'
      - 'index.html'
      - 'style.css'
      - 'site.js'
      - 'scripts/mirror_gumroad.py'
      - 'scripts/build_gumroad_site.py'
      - 'releases.json'
      - 'concerts-data.json'
      - '.github/workflows/preview-gumroad-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check Gumroad page eligibility
        id: readiness
        run: |
          if python3 -c 'from scripts.render_gumroad_catalog import load_catalog, safe_product; import sys; sys.exit(0 if any(safe_product(p) and not str(p.get("title", "")).strip().upper().startswith("TEST ") for p in load_catalog()) else 1)'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Page preview/publication postponed until a genuine published product is available. Existing Gumroad pages stay unchanged."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate same page as the publish workflow
        if: steps.readiness.outputs.ready == 'true'
        run: python3 scripts/build_gumroad_site.py --output "$RUNNER_TEMP/simon-gumroad-profile.html"
      - uses: actions/setup-go@v5
        if: steps.readiness.outputs.ready == 'true'
        with:
          go-version: '1.25.x'
      - name: Install official Gumroad CLI
        if: steps.readiness.outputs.ready == 'true'
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Confirm seller identity
        if: steps.readiness.outputs.ready == 'true'
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          test -n "$GUMROAD_ACCESS_TOKEN" || { echo "::error::GUMROAD_ACCESS_TOKEN missing"; exit 1; }
          gumroad user --json --no-input --jq '.user | {username, name}'
      - name: Preview and sanitize custom Gumroad homepage (no publishing)
        if: steps.readiness.outputs.ready == 'true'
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          gumroad pages preview "$RUNNER_TEMP/simon-gumroad-profile.html" --json --no-input > "$RUNNER_TEMP/gumroad-preview.json"
          python - "$RUNNER_TEMP/gumroad-preview.json" <<'PY'
          import json,sys
          preview=json.load(open(sys.argv[1],encoding='utf-8'))
          if not preview.get('success',True):
              raise SystemExit('Gumroad rejected custom profile preview')
          html=preview.get('custom_html') or ''
          report=preview.get('sanitization_report') or {}
          print('Preview accepted; sanitized HTML characters:',len(html))
          print('Sanitization report:',json.dumps(report,ensure_ascii=False)[:2000])
          # All branded areas and links must survive the sanitizer.
          for token in ('SIMON LIBON','Music','Concerts','TABS','MERCH','NEWSLETTER','https://simonlibonstore.gumroad.com/'):
              if token.lower() not in html.lower():
                  raise SystemExit('Gumroad stripped essential element: '+token)
          PY
      - name: Report no live changes
        if: steps.readiness.outputs.ready == 'true'
        run: echo "This workflow only previews the Gumroad site. It does not publish, email, or modify any product."
