name: Publish full Gumroad storefront
on:
  push:
    branches: [main]
    paths:
      - 'gumroad-site/profile.html'
      - 'index.html'
      - 'style.css'
      - 'site.js'
      - 'scripts/mirror_gumroad.py'
      - 'scripts/build_gumroad_site.py'
      - 'releases.json'
      - 'concerts-data.json'
      - '.github/workflows/publish-gumroad-site.yml'
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * *'

permissions:
  contents: read

concurrency:
  group: gumroad-profile-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check Gumroad page eligibility
        id: readiness
        run: |
          if python3 -c 'from scripts.render_gumroad_catalog import load_catalog, safe_product; import sys; sys.exit(0 if any(safe_product(p) and not str(p.get("title", "")).strip().upper().startswith("TEST ") for p in load_catalog()) else 1)'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Page preview/publication postponed until a genuine published product is available. Existing Gumroad pages stay unchanged."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate release and concert sections from live data
        if: steps.readiness.outputs.ready == 'true'
        run: python3 scripts/build_gumroad_site.py --output "$RUNNER_TEMP/simon-gumroad-profile.html"
      - uses: actions/setup-go@v5
        if: steps.readiness.outputs.ready == 'true'
        with:
          go-version: '1.25.x'
      - name: Install official Gumroad CLI
        if: steps.readiness.outputs.ready == 'true'
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Authenticate and verify account
        if: steps.readiness.outputs.ready == 'true'
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          test -n "$GUMROAD_ACCESS_TOKEN" || { echo "::error::Missing GitHub secret GUMROAD_ACCESS_TOKEN"; exit 1; }
          gumroad user --json --no-input > "$RUNNER_TEMP/gumroad-user.json"
          python - "$RUNNER_TEMP/gumroad-user.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          user=data.get('user') or {}
          identifiers=[str(user.get(x) or '') for x in ('id','user_id')]
          usernames=[str(user.get(x) or '') for x in ('username','user_name')]
          urls=[str(user.get(x) or '') for x in ('url','profile_url')]
          valid=('2138284912808' in identifiers or 'simonlibonstore' in usernames or
                 any(u.rstrip('/')=='https://simonlibonstore.gumroad.com' for u in urls))
          print('Store identity fields:',{'id':identifiers,'username':usernames,'url':urls,'name':user.get('name')})
          assert valid, 'Connected Gumroad account identity does not match the selected store'
          print('Connected to the correct Gumroad creator.')
          PY
      - name: Backup current storefront
        if: steps.readiness.outputs.ready == 'true'
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/gumroad-backup"
          if gumroad pages pull profile -o "$RUNNER_TEMP/gumroad-backup/profile-before.html" --json --no-input; then
            echo "Backed up existing custom storefront HTML."
          else
            echo "No custom storefront to pull; attempting a snapshot of the standard profile."
            gumroad pages scaffold profile -o "$RUNNER_TEMP/gumroad-backup/profile-before.html" --json --no-input
          fi
      - name: Store backup for rollback
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gumroad-profile-before
          path: ${{ runner.temp }}/gumroad-backup/profile-before.html
          if-no-files-found: error
      - name: Preview and validate new complete website
        if: steps.readiness.outputs.ready == 'true'
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          gumroad pages preview "$RUNNER_TEMP/simon-gumroad-profile.html" --json --no-input > "$RUNNER_TEMP/gumroad-preview.json"
          python - "$RUNNER_TEMP/gumroad-preview.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          if data.get('success') is False:
              raise SystemExit('Gumroad profile preview failed: no live changes made')
          html=data.get('custom_html') or ''
          if not html:
              raise SystemExit('Empty sanitized Gumroad profile: refusing to publish')
          required=['SIMON LIBON','data-page="home"','data-sl-mirror-css="style.css"','class="header"','class="footer"','href="https://simonlibon.github.io/?newsletter=1"','https://simonlibonstore.gumroad.com/']
          missing=[x for x in required if x.lower() not in html.lower()]
          if missing:
              raise SystemExit('Gumroad removed essential content: '+repr(missing))
          if 'id="newsletter-dialog"' in html:
              raise SystemExit('Gumroad cannot render the original embedded newsletter; empty modal would remain')
          print('Preview accepted: all main sections survived Gumroad sanitization.')
          print('Sanitization report:',json.dumps(data.get('sanitization_report') or {})[:1000])
          PY
      - name: Publish complete branded Gumroad homepage
        if: steps.readiness.outputs.ready == 'true'
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          gumroad pages push profile "$RUNNER_TEMP/simon-gumroad-profile.html" --json --no-input > "$RUNNER_TEMP/gumroad-published.json"
          python - "$RUNNER_TEMP/gumroad-published.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          if data.get('success') is False:
              raise SystemExit('Gumroad refused the page publication.')
          print('Gumroad profile update submitted.')
          print('Public profile:',data.get('profile_url') or 'https://simonlibonstore.gumroad.com')
          PY
