name: Send newsletter for newly published music

# Manual emergency fallback only. The dedicated release monitor owns automatic announcements.
# Do not run manually for a release already announced in EmailOctopus.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-announcement-pipeline
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find releases newly marked published
        id: releases
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess
          from datetime import date
          before = os.environ["BEFORE_SHA"]
          try:
              previous = json.loads(subprocess.check_output(
                  ["git", "show", f"{before}:releases.json"], text=True
              )).get("releases", [])
          except (subprocess.CalledProcessError, json.JSONDecodeError):
              previous = []
          current = json.loads(open("releases.json", encoding="utf-8").read()).get("releases", [])
          old = {item.get("id"): item for item in previous if isinstance(item, dict)}
          ids = []
          seen = set()
          for item in current:
              if not isinstance(item, dict) or item.get("published") is not True:
                  continue
              release_id = item.get("id")
              if not isinstance(release_id, str) or not release_id or release_id in seen:
                  raise SystemExit("Invalid or duplicate release id in releases.json")
              seen.add(release_id)
              if old.get(release_id, {}).get("published") is not True:
                  if not re.fullmatch(r"[a-z0-9-]{1,80}", release_id):
                      raise SystemExit("New release id must use lowercase letters, numbers and hyphens")
                  try:
                      date.fromisoformat(item.get("release_date", ""))
                  except (TypeError, ValueError):
                      raise SystemExit(f"Newly published release {release_id} needs release_date in YYYY-MM-DD format")
                  ids.append(release_id)
          print("release_ids=" + json.dumps(ids, separators=(",", ":")))
          print("release_count=" + str(len(ids)))
          PY
          cat "$GITHUB_OUTPUT"


      - name: Publish the latest release cover
        if: steps.releases.outputs.release_count != '0'
        env:
          RELEASE_IDS: ${{ steps.releases.outputs.release_ids }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import io, json, os, re, urllib.request
          from datetime import date
          from pathlib import Path
          from PIL import Image, ImageOps
          ids = set(json.loads(os.environ["RELEASE_IDS"]))
          releases = json.loads(Path("releases.json").read_text(encoding="utf-8"))["releases"]
          candidates = [item for item in releases if isinstance(item, dict)
                        and item.get("published") is True and item.get("id") in ids]
          if not candidates:
              raise SystemExit("No newly published release cover found")
          release = max(candidates, key=lambda item: date.fromisoformat(item["release_date"]))
          url = release.get("cover")
          if not isinstance(url, str) or not url.startswith("https://"):
              raise SystemExit("Published release needs a public HTTPS cover URL")
          request = urllib.request.Request(url, headers={"User-Agent": "SimonLibon-ReleaseNewsletter"})
          with urllib.request.urlopen(request, timeout=30) as response:
              content_type = response.headers.get_content_type()
              if not content_type.startswith("image/"):
                  raise SystemExit("Release cover URL did not return an image")
              raw = response.read(20 * 1024 * 1024 + 1)
          if len(raw) > 20 * 1024 * 1024:
              raise SystemExit("Release cover exceeds the 20 MB limit")
          with Image.open(io.BytesIO(raw)) as image:
              image.verify()
          with Image.open(io.BytesIO(raw)) as image:
              image = ImageOps.exif_transpose(image).convert("RGB")
              image = ImageOps.fit(image, (1080, 1080), method=Image.Resampling.LANCZOS)
              output = Path("assets/newsletter/latest-release-cover.jpg")
              output.parent.mkdir(parents=True, exist_ok=True)
              image.save(output, format="JPEG", quality=90, optimize=True)
          print("Prepared the latest release cover for the newsletter.")
          PY

      - name: Publish the cover image to the site
        if: steps.releases.outputs.release_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/newsletter/latest-release-cover.jpg
          if git diff --cached --quiet; then
            echo "The current newsletter cover is unchanged."
          else
            git commit -m "Update latest release newsletter cover"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Queue the release email for subscribed contacts
        if: steps.releases.outputs.release_count != '0'
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
          RELEASE_IDS: ${{ steps.releases.outputs.release_ids }}
          AUTOMATION_ID: 70b5faf8-e526-11f1-9ffa-5565b58f1bcc
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EMAILOCTOPUS_API_KEY:-}" ]]; then
            echo "::error::EMAILOCTOPUS_API_KEY is missing; no newsletter was queued."
            exit 1
          fi
          auth="Authorization: Bearer ${EMAILOCTOPUS_API_KEY}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          code=$(curl -sS --max-time 30 -H "$auth" -o "$tmp/lists.json" -w '%{http_code}' \
            'https://api.emailoctopus.com/lists')
          if [[ "$code" != 200 ]]; then
            echo "::error::EmailOctopus list lookup failed with HTTP $code; no newsletter was queued."
            exit 1
          fi
          list_count=$(jq '.data | length' "$tmp/lists.json")
          if [[ "$list_count" != 1 ]]; then
            echo "::error::Expected the single Simon Libon newsletter list; found $list_count. No emails were queued."
            exit 1
          fi
          list_id=$(jq -r '.data[0].id' "$tmp/lists.json")
          if [[ ! "$list_id" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            echo "::error::EmailOctopus returned an unexpected list id. No emails were queued."
            exit 1
          fi

          contacts_url="https://api.emailoctopus.com/lists/${list_id}/contacts?limit=100"
          pages=0
          while [[ -n "$contacts_url" ]]; do
            if [[ ! "$contacts_url" =~ ^https://api\.emailoctopus\.com/ ]]; then
              echo "::error::EmailOctopus returned an unsafe pagination URL. Aborting."
              exit 1
            fi
            code=$(curl -sS --max-time 30 -H "$auth" -o "$tmp/contacts.json" -w '%{http_code}' "$contacts_url")
            if [[ "$code" != 200 ]]; then
              echo "::error::EmailOctopus contact lookup failed with HTTP $code. No further emails were queued."
              exit 1
            fi
            jq -r '.data[]? | select((.status | ascii_downcase) == "subscribed") | .id' "$tmp/contacts.json" >> "$tmp/subscribed-ids.txt"
            next_url=$(jq -r '.paging.next.url // empty' "$tmp/contacts.json")
            if [[ -n "$next_url" ]]; then
              contacts_url="$next_url"
            else
              cursor=$(jq -r '.paging.next.starting_after // empty' "$tmp/contacts.json")
              if [[ -n "$cursor" ]]; then
                encoded_cursor=$(jq -rn --arg v "$cursor" '$v|@uri')
                contacts_url="https://api.emailoctopus.com/lists/${list_id}/contacts?limit=100&starting_after=${encoded_cursor}"
              else
                contacts_url=""
              fi
            fi
            pages=$((pages + 1))
            if (( pages > 1000 )); then
              echo "::error::Pagination safety limit reached. Aborting."
              exit 1
            fi
          done

          if [[ ! -s "$tmp/subscribed-ids.txt" ]]; then
            echo "No subscribed contacts found; nothing was queued."
            exit 0
          fi

          contact_count=$(sort -u "$tmp/subscribed-ids.txt" | wc -l | tr -d ' ')
          queued=0
          while IFS= read -r contact_id; do
            [[ -n "$contact_id" ]] || continue
            body=$(jq -cn --arg contact_id "$contact_id" '{contact_id:$contact_id}')
            code=$(curl -sS --max-time 30 -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "$body" -o "$tmp/queue-response.json" -w '%{http_code}' \
              "https://api.emailoctopus.com/automations/${AUTOMATION_ID}/queue")
            if [[ "$code" != 200 && "$code" != 204 ]]; then
              error_code=$(jq -r '.error.code // .code // .type // "unknown"' "$tmp/queue-response.json" 2>/dev/null || true)
              if [[ ! "$error_code" =~ ^[A-Za-z0-9_.:/-]{1,100}$ ]]; then error_code="unknown"; fi
              echo "::error::EmailOctopus did not queue a subscribed contact (HTTP $code; $error_code)."
              exit 1
            fi
            queued=$((queued + 1))
          done < <(sort -u "$tmp/subscribed-ids.txt")

          echo "Queued the new release automation for $queued subscribed contact(s)."
          echo "Release IDs detected: $RELEASE_IDS"
