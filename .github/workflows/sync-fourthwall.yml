name: Sync Fourthwall product catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_fourthwall.py'
      - '.github/workflows/sync-fourthwall.yml'
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: write
concurrency:
  group: fourthwall-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch live published Fourthwall products
        env:
          FOURTHWALL_STOREFRONT_TOKEN: ${{ secrets.FOURTHWALL_STOREFRONT_TOKEN }}
        run: python scripts/sync_fourthwall.py
      - name: Publish catalog changes
        run: |
          git add -- fourthwall-products.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Fourthwall catalog"
            git push
          fi
