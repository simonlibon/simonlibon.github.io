name: Sync Gumroad shop
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync published products
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          if [ -z "$GUMROAD_ACCESS_TOKEN" ]; then
            echo "GUMROAD_ACCESS_TOKEN secret is missing"
            exit 1
          fi
          python scripts/sync_gumroad.py
      - name: Commit catalogue changes
        run: |
          if ! git diff --quiet -- catalog.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.js
            git commit -m "Sync published Gumroad catalogue"
            git push
          fi
