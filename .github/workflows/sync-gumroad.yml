name: Sync Gumroad shop

on:
  schedule:
    # GitHub Actions supports a minimum five-minute interval; jobs may start late.
    - cron: '4/5 * * * *'
  workflow_dispatch:
  # Refresh the Gumroad catalog when the sync workflow or script is updated.
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-gumroad.yml'
      - 'scripts/sync_gumroad.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: gumroad-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # Re-runs may start from an old workflow commit. Always sync against the
      # current main branch so the catalog commit does not overwrite or reject
      # unrelated website changes made after the original run.
      - name: Refresh checkout to latest main
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main refs/remotes/origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate current catalogue format
        run: |
          python - <<'PY'
          from scripts.sync_gumroad import read_catalogue
          catalogue, _ = read_catalogue()
          print(f"Catalogue validated: {len(catalogue['products'])} existing entries.")
          PY

      - name: Synchronise published Gumroad products
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          if [ -z "$GUMROAD_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret GUMROAD_ACCESS_TOKEN"
            exit 1
          fi
          python scripts/sync_gumroad.py

      - name: Publish catalogue only when changed
        id: publish-catalog
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other website edits can land between our checkout and push.
          # On conflict, regenerate from the new main and the current Gumroad
          # inventory instead of force-pushing an outdated catalogue.
          for attempt in 1 2 3 4; do
            if git diff --quiet -- catalog.js; then
              echo "No catalogue changes"
              exit 0
            fi
            git add -- catalog.js
            git commit -m "Sync published Gumroad catalogue"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Concurrent main update (attempt $attempt); regenerating catalogue."
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            python scripts/sync_gumroad.py
          done
          echo "::error::Catalogue sync could not publish after four attempts."
          exit 1

      - name: Immediately refresh Gumroad shop and product pages
        if: steps.publish-catalog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A commit made with GITHUB_TOKEN does not fire other push workflows.
          # Workflow dispatch is the supported way to keep both sites in sync.
          gh workflow run deploy-pages.yml --ref main
          gh workflow run mirror-gumroad-pages.yml --ref main
          gh workflow run gumroad-product-pages.yml --ref main
          gh workflow run publish-gumroad-site.yml --ref main
          echo "Official website, Gumroad pages, homepage and product-page refreshes dispatched"
