name: Test EmailOctopus on Simon's mailbox
on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger the new music automation for Simon only
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EMAILOCTOPUS_API_KEY}" ]]; then
            echo "::error::Configure EMAILOCTOPUS_API_KEY before running the private test."
            exit 1
          fi
          # Key downloads can include a trailing line ending.
          token=$(printf '%s' "$EMAILOCTOPUS_API_KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/d')
          if [[ ! "$token" =~ ^[A-Za-z0-9._~+/=-]+$ ]]; then
            echo "::error::The stored value is not a single bearer token. Replace the repository secret."
            exit 1
          fi
          auth_status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${token}" 'https://api.emailoctopus.com/lists')
          if [[ "$auth_status" != 200 ]]; then
            echo "::error::EmailOctopus key verification returned HTTP $auth_status."
            exit 1
          fi
          echo "EmailOctopus authenticated the GitHub Actions secret."
          contact_id=$(printf %s 'simonlibon.music@gmail.com' | md5sum | cut -d' ' -f1)
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          status=$(curl --silent --show-error --max-time 30 --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${token}" \
            --header 'Content-Type: application/json' \
            --data "{\"contact_id\":\"${contact_id}\"}" \
            'https://api.emailoctopus.com/automations/70b5faf8-e526-11f1-9ffa-5565b58f1bcc/queue')
          if [[ "$status" != 204 ]]; then
            # Only record the short, non-sensitive API error code; never echo a token or full response.
            error_code=$(jq -r '.error.code // .code // "unknown"' "$response_file" 2>/dev/null || true)
            if [[ ! "$error_code" =~ ^[A-Za-z0-9_-]{1,60}$ ]]; then error_code="unknown"; fi
            echo "::notice::EmailOctopus queue response: HTTP $status; code $error_code"
          fi
          if [[ "$status" == 403 ]]; then
            echo "::error::The EmailOctopus API token authenticated, but the automation-queue action was forbidden (HTTP 403). Verify that this automation is active, has the 'Manually via API' trigger, that the test contact is subscribed, and that the account is permitted to start automations."
            exit 1
          fi
          if [[ "$status" != 204 ]]; then
            echo "::error::EmailOctopus automation queue returned HTTP $status (expected 204). Verify the automation ID, eligible contact, and re-entry settings."
            exit 1
          fi
          echo "EmailOctopus accepted the test for Simon. Verify receipt in Gmail."
