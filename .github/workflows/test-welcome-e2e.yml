name: Check newsletter welcome configuration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-welcome-e2e.yml'
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify EmailOctopus account without sending mail
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EMAILOCTOPUS_API_KEY:-}" ]]; then
            echo "::error::EMAILOCTOPUS_API_KEY is missing"
            exit 1
          fi
          output=$(mktemp)
          trap 'rm -f "$output"' EXIT
          status=$(curl -sS --max-time 20 -o "$output" -w '%{http_code}' \
            -H "Authorization: Bearer ${EMAILOCTOPUS_API_KEY}" \
            'https://api.emailoctopus.com/lists')
          echo "GET lists: HTTP $status"
          if [[ "$status" != 200 ]]; then
            echo "::error::Unable to inspect account lists"
            exit 1
          fi
          python3 - "$output" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1]))
          lists=payload.get('data',payload.get('lists',payload)) if isinstance(payload,dict) else payload
          if not isinstance(lists,list):
              print("Unrecognised list response shape")
              sys.exit(1)
          print("Number of newsletter lists:",len(lists))
          for item in lists:
              print("List:",item.get('name','(unnamed)'),"double opt-in:",item.get('double_opt_in','unknown'))
          PY
          status=$(curl -sS --max-time 20 -o "$output" -w '%{http_code}' \
            -H "Authorization: Bearer ${EMAILOCTOPUS_API_KEY}" \
            'https://api.emailoctopus.com/automations')
          echo "GET automations: HTTP $status"
          if [[ "$status" == 200 ]]; then
            python3 - "$output" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          automations=p.get('data',p.get('automations',p)) if isinstance(p,dict) else p
          if isinstance(automations,list):
              print("Number of automations:",len(automations))
              for a in automations:
                  print("Automation:",a.get('name','(unnamed)'),"status:",a.get('status','unknown'),"trigger:",a.get('trigger_type','unknown'))
          else:print("Automation response format differs from expected")
          PY
          else
            echo "Automation listing is not accessible through this API route"
          fi
      - name: Test a new subscription to the only audience (owner mailbox only)
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${EMAILOCTOPUS_API_KEY}"
          lists=$(mktemp)
          response=$(mktemp)
          trap 'rm -f "$lists" "$response"' EXIT
          curl -fsS --max-time 20 -H "$auth" 'https://api.emailoctopus.com/lists' > "$lists"
          list_count=$(jq '.data | length' "$lists")
          if [[ "$list_count" != 1 ]]; then
            echo "::error::Expected exactly one newsletter list; got $list_count. Aborting without creating contact."
            exit 1
          fi
          list_id=$(jq -r '.data[0].id' "$lists")
          double_opt_in=$(jq -r '.data[0].double_opt_in' "$lists")
          if [[ "$double_opt_in" != false ]]; then
            echo "::error::List requires confirmation, so this test will not silently bypass opt-in."
            exit 1
          fi
          alias="simonlibon.music+welcome-check-${GITHUB_RUN_ID}@gmail.com"
          body=$(jq -nc --arg email "$alias" '{email_address:$email,status:"subscribed"}')
          code=$(curl -sS --max-time 30 -X POST -H "$auth" -H 'Content-Type: application/json' \
            -d "$body" -o "$response" -w '%{http_code}' \
            "https://api.emailoctopus.com/lists/${list_id}/contacts")
          echo "New owner-only test contact: HTTP $code"
          if [[ "$code" != 200 && "$code" != 201 ]]; then
            jq -r '.error.code // .code // "unknown error"' "$response" 2>/dev/null || true
            exit 1
          fi
          jq -r '"Contact status: " + (.data.status // .status // "unknown")' "$response"
          echo "Check Gmail for a welcome message addressed to the test alias; only this owner mailbox was used."
