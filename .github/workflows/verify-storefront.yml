name: Verify storefront without publishing
on:
  push:
    branches: [main]
    paths:
      - 'catalog.js'
      - 'shop-model.js'
      - 'shop.js'
      - 'product.js'
      - 'tabs.html'
      - 'product.html'
      - 'scripts/sync_gumroad.py'
      - 'tests/test_shop.js'
      - 'tests/test_gumroad_sync.py'
      - 'tests/test_gumroad_site.py'
      - 'tests/test_gumroad_mirror.py'
      - 'tests/test_gumroad_catalog_html.py'
      - 'tests/test_gumroad_product_details.py'
      - 'scripts/render_gumroad_products.py'
      - 'scripts/render_gumroad_catalog.py'
      - 'scripts/build_gumroad_mirror_pages.py'
      - 'tests/test_gumroad_product_options.py'
      - 'scripts/publish_gumroad_product_pages.py'
      - 'scripts/mirror_gumroad.py'
      - 'product.html'
      - 'style.css'
      - 'shop.css'
      - 'index.html'
      - 'site.js'
      - 'scripts/build_gumroad_site.py'
      - 'gumroad-site/profile.html'
      - 'releases.json'
      - 'concerts-data.json'
      - '.github/workflows/verify-storefront.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check storefront links, grouping and hidden drafts
        run: node tests/test_shop.js
      - name: Check safe Gumroad synchronization without network access
        run: python -m unittest discover -s tests -p 'test_gumroad_sync.py' -v
      - name: Test the full Gumroad site with draft, release and concert fixtures
        run: python -m unittest discover -s tests -p 'test_gumroad_site.py' -v
      - name: Check Gumroad mirrors official homepage and product detail DOM and CSS
        run: python -m unittest discover -s tests -p 'test_gumroad_mirror.py' -v
      - name: Check native Gumroad product selectors and draft protection
        run: python -m unittest discover -s tests -p 'test_gumroad_product_options.py' -v
      - name: Check Gumroad HTML-first catalogue against the official site
        run: python -m unittest discover -s tests -p 'test_gumroad_catalog_html.py' -v
      - name: Check official-style Gumroad product detail pages and variant selection
        run: python -m unittest discover -s tests -p 'test_gumroad_product_details.py' -v
      - name: Generate actual Gumroad homepage from current public data
        run: |
          python scripts/build_gumroad_site.py --output "$RUNNER_TEMP/simon-gumroad-profile.html"
          test -s "$RUNNER_TEMP/simon-gumroad-profile.html"
