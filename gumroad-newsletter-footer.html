<!-- Simon Libon — Gumroad newsletter footer. Insert before the footer on each custom page. -->
<style>
.sl-newsletter{box-sizing:border-box;background:#faf9f7;color:#18181a;border-top:1px solid #e7e4e1;font-family:'DM Sans',Arial,sans-serif}
.sl-newsletter *{box-sizing:border-box}
.sl-newsletter-inner{max-width:1080px;margin:auto;padding:36px 24px 38px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,4vw,55px);align-items:center}
.sl-newsletter-kicker{font-size:9px;letter-spacing:.17em;font-weight:700;color:#77757a;margin:0 0 8px}
.sl-newsletter h2{font-size:clamp(27px,3.2vw,40px);line-height:1.05;letter-spacing:-.07em;margin:0 0 8px}
.sl-newsletter-description{font-size:11px;line-height:1.55;color:#77757a;max-width:310px;margin:0}
.sl-newsletter-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sl-newsletter label{display:flex;flex-direction:column;gap:6px;font-size:9px;font-weight:700;letter-spacing:.1em;min-width:0}
.sl-newsletter input[type=email],.sl-newsletter select{width:100%;height:38px;min-width:0;border:1px solid #d1ced0;border-radius:0;padding:0 9px;background:#f3f1ee;color:#77757a;font-size:12px}
.sl-newsletter .sl-newsletter-consent{display:flex;flex-direction:row;align-items:flex-start;gap:8px;margin:10px 0;font-size:10px;line-height:1.45;color:#66636a;font-weight:400;letter-spacing:0}
.sl-newsletter-consent input{margin:2px 0 0}
.sl-newsletter button{width:100%;min-height:36px;background:#1a191d;color:#fff;border:0;font-size:10px;letter-spacing:.13em;font-weight:700;opacity:.58}
.sl-newsletter-note{font-size:9px;line-height:1.5;color:#827f86;margin:7px 0 0}
@media(max-width:760px){.sl-newsletter-inner{grid-template-columns:1fr;gap:16px;padding:30px 20px 32px}.sl-newsletter h2{font-size:30px}.sl-newsletter-description{max-width:none}}
@media(max-width:370px){.sl-newsletter-fields{gap:7px}.sl-newsletter input[type=email],.sl-newsletter select{font-size:11px;padding:0 6px}}
</style>
<section class="sl-newsletter" aria-labelledby="sl-newsletter-title">
 <div class="sl-newsletter-inner">
  <div><p class="sl-newsletter-kicker">STAY UPDATED</p><h2 id="sl-newsletter-title">NEWSLETTER.</h2><p class="sl-newsletter-description">Music, concerts, tabs and backing tracks. Updates from Simon Libon.</p></div>
  <div aria-label="Newsletter subscription not yet active">
   <div class="sl-newsletter-fields"><label>EMAIL<input type="email" placeholder="Your email address" disabled></label><label>COUNTRY<select disabled><option>Select your country</option><option>Belgium</option><option>France</option><option>Netherlands</option><option>Germany</option><option>United Kingdom</option><option>United States</option><option>Other</option></select></label></div>
   <label class="sl-newsletter-consent"><input type="checkbox" disabled> I agree to receive email updates. I can unsubscribe at any time.</label>
   <button type="button" disabled>SUBSCRIBE</button>
   <p class="sl-newsletter-note">Subscriptions are not yet active.</p>
  </div>
 </div>
</section>
